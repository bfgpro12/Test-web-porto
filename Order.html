			<label>Nama
				<input type="text" name="nama" required>
			</label>
			<label>Email
				<input type="email" name="email" required>
			</label>
			<label>Paket
				<select id="paket" name="paket">

					<option value="enterprise" data-price="1500">Enterprise — Integrasi & Custom — Rp1.5jt</option>
				</select>
			</label>
			<div class="price">Estimasi: <span id="price">Rp300k</span></div>
			<button class="btn primary" type="submit">Kirim Permintaan</button>
		</form>
		<div id="orderMsg" class="msg" aria-live="polite"></div>
